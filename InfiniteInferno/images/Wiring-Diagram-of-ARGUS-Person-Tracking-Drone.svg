<svg xmlns="http://www.w3.org/2000/svg" width="750" height="700" viewBox="0 0 750 700">
  <!--
    Wiring diagram: ARGUS person-tracking drone. Black on white.
    Vision side on top (webcam, USB hub, power bank, UNO Q); flight side below
    (LiPo, Matek PDB-XT60, 4 ESCs, 4 A2212 motors, Pixhawk 2.4.8, M10 GPS, RC receiver).
    Solid lines carry power or USB, dashed lines carry ESC signals.
    Assumed connections (standard, not stated in the repo): PDB pads to ESCs,
    ESC signals to MAIN OUT 1-4, GPS and RC receiver ports on the Pixhawk.
    UNO Q and Pixhawk power sources are not drawn because the repo does not show them.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .w    { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; }
      .sig  { fill: none; stroke: #000000; stroke-width: 2; stroke-dasharray: 7 5; }
      .lbl  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 14px;
              fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .sm   { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11px;
              fill: #000000; dominant-baseline: middle; }
      .note { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-size: 12px; font-style: italic;
              fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .dot  { fill: #000000; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="700"/>

  <!-- ===== Vision side ===== -->
  <rect class="box" x="30" y="40" width="150" height="60" rx="4"/>
  <text class="lbl" x="105" y="62">USB WEBCAM</text>
  <circle class="thin" cx="105" cy="84" r="8"/>
  <circle class="thin" cx="105" cy="84" r="3.5"/>

  <rect class="box" x="300" y="40" width="150" height="60" rx="4"/>
  <text class="lbl" x="375" y="62">POWERED</text>
  <text class="lbl" x="375" y="80">USB HUB</text>

  <rect class="box" x="300" y="138" width="150" height="40" rx="4"/>
  <text class="lbl" x="375" y="158">POWER BANK</text>

  <rect class="box" x="570" y="30" width="150" height="80" rx="4"/>
  <text class="lbl" x="645" y="62">ARDUINO</text>
  <text class="lbl" x="645" y="80">UNO Q</text>
  <rect class="thin" x="580" y="36" width="90" height="6"/>
  <rect class="thin" x="600" y="98" width="110" height="6"/>

  <path class="w" d="M180,70 L300,70"/>
  <text class="sm" x="222" y="60">USB</text>
  <path class="w" d="M450,70 L570,70"/>
  <text class="sm" x="492" y="60">USB</text>
  <path class="w" d="M375,138 L375,100"/>
  <text class="sm" x="382" y="120">5V</text>

  <!-- separator -->
  <path class="thin" d="M30,212 L720,212" stroke-dasharray="3 5"/>
  <rect class="bg" x="215" y="203" width="320" height="18"/>
  <text class="note" x="375" y="212">No data link between the UNO Q and the Pixhawk yet</text>

  <!-- ===== Flight side ===== -->
  <!-- Battery -->
  <rect class="box" x="20" y="445" width="100" height="60" rx="4"/>
  <text class="lbl" x="70" y="467">LIPO</text>
  <text class="lbl" x="70" y="485">BATTERY</text>
  <path class="w" d="M120,475 L150,475"/>
  <text class="sm" x="135" y="460" text-anchor="middle">XT60</text>

  <!-- PDB -->
  <rect class="box" x="150" y="330" width="100" height="290" rx="4"/>
  <text class="lbl" x="200" y="466">MATEK</text>
  <text class="lbl" x="200" y="484">PDB-XT60</text>
  <rect class="thin" x="238" y="351" width="8" height="14"/>
  <rect class="thin" x="238" y="429" width="8" height="14"/>
  <rect class="thin" x="238" y="507" width="8" height="14"/>
  <rect class="thin" x="238" y="585" width="8" height="14"/>

  <!-- ESC column label -->
  <text class="sm" x="335" y="318" text-anchor="middle">ESCs</text>

  <!-- ESC 1..4 : y0 = 330, 408, 486, 564 -->
  <g id="esc1">
    <rect class="box" x="290" y="330" width="90" height="56" rx="4"/>
    <text class="lbl" x="335" y="358">ESC 1</text>
    <path class="w" d="M250,358 L290,358"/>
    <path class="thin" d="M380,361 L446.7,361"/><path class="thin" d="M380,368 L445,368"/><path class="thin" d="M380,375 L446.7,375"/>
    <circle class="box" cx="460" cy="368" r="15"/><text class="sm" x="460" y="369" text-anchor="middle">M1</text>
    <path class="sig" d="M380,342 L560,342"/>
  </g>
  <g id="esc2">
    <rect class="box" x="290" y="408" width="90" height="56" rx="4"/>
    <text class="lbl" x="335" y="436">ESC 2</text>
    <path class="w" d="M250,436 L290,436"/>
    <path class="thin" d="M380,439 L446.7,439"/><path class="thin" d="M380,446 L445,446"/><path class="thin" d="M380,453 L446.7,453"/>
    <circle class="box" cx="460" cy="446" r="15"/><text class="sm" x="460" y="447" text-anchor="middle">M2</text>
    <path class="sig" d="M380,420 L560,420"/>
  </g>
  <g id="esc3">
    <rect class="box" x="290" y="486" width="90" height="56" rx="4"/>
    <text class="lbl" x="335" y="514">ESC 3</text>
    <path class="w" d="M250,514 L290,514"/>
    <path class="thin" d="M380,517 L446.7,517"/><path class="thin" d="M380,524 L445,524"/><path class="thin" d="M380,531 L446.7,531"/>
    <circle class="box" cx="460" cy="524" r="15"/><text class="sm" x="460" y="525" text-anchor="middle">M3</text>
    <path class="sig" d="M380,498 L560,498"/>
  </g>
  <g id="esc4">
    <rect class="box" x="290" y="564" width="90" height="56" rx="4"/>
    <text class="lbl" x="335" y="592">ESC 4</text>
    <path class="w" d="M250,592 L290,592"/>
    <path class="thin" d="M380,595 L446.7,595"/><path class="thin" d="M380,602 L445,602"/><path class="thin" d="M380,609 L446.7,609"/>
    <circle class="box" cx="460" cy="602" r="15"/><text class="sm" x="460" y="603" text-anchor="middle">M4</text>
    <path class="sig" d="M380,576 L560,576"/>
  </g>
  <text class="sm" x="460" y="638" text-anchor="middle">A2212 1000KV</text>

  <!-- Pixhawk -->
  <rect class="box" x="560" y="300" width="160" height="345" rx="4"/>
  <text class="sm" x="597" y="314" text-anchor="middle">GPS</text>
  <text class="sm" x="682" y="314" text-anchor="middle">RC IN</text>
  <text class="sm" x="568" y="342">MAIN OUT 1</text>
  <text class="sm" x="568" y="420">MAIN OUT 2</text>
  <text class="sm" x="568" y="498">MAIN OUT 3</text>
  <text class="sm" x="568" y="576">MAIN OUT 4</text>
  <text class="lbl" x="640" y="612">PIXHAWK</text>
  <text class="lbl" x="640" y="630">2.4.8</text>
  <circle class="dot" cx="560" cy="342" r="3.5"/><circle class="dot" cx="560" cy="420" r="3.5"/>
  <circle class="dot" cx="560" cy="498" r="3.5"/><circle class="dot" cx="560" cy="576" r="3.5"/>

  <!-- GPS and RC receiver -->
  <rect class="box" x="560" y="236" width="75" height="40" rx="4"/>
  <text class="lbl" x="597" y="256">M10 GPS</text>
  <rect class="box" x="645" y="236" width="75" height="40" rx="4"/>
  <text class="lbl" x="682" y="256">RC RX</text>
  <path class="w" d="M597,276 L597,300"/>
  <path class="w" d="M682,276 L682,300"/>

  <!-- Legend -->
  <path class="w" d="M30,668 L70,668"/><text class="sm" x="78" y="668">Power / USB</text>
  <path class="sig" d="M180,668 L220,668"/><text class="sm" x="228" y="668">ESC signal</text>
  <path class="thin" d="M325,664 L365,664"/><path class="thin" d="M325,672 L365,672"/><text class="sm" x="373" y="668">Motor phases (3 wires)</text>
</svg>
