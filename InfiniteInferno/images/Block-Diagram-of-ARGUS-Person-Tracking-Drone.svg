<svg xmlns="http://www.w3.org/2000/svg" width="750" height="560" viewBox="0 0 750 560">
  <!--
    Block diagram: ARGUS person-tracking drone (digestdocs, CircuitDigest style)
    Top row: vision side (camera -> UNO Q -> JSON flight intent).
    Middle/bottom: flight side (RC receiver -> Pixhawk -> ESCs -> motors, battery -> PDB -> ESCs).
    The dashed line is the planned intent-to-Pixhawk link, which is not built yet.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 3; }
      .wire { fill: none; stroke: #000000; stroke-width: 4; stroke-linejoin: miter; }
      .dash { fill: none; stroke: #000000; stroke-width: 4; stroke-dasharray: 11 8; }
      .lbl  { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="750" height="560"/>
  <g id="watermark" opacity="0.10"></g>

  <!-- Row A: vision side -->
  <rect class="box" x="45" y="20" width="190" height="70"/>
  <text class="lbl" x="140" y="45">Camera</text>
  <text class="lbl" x="140" y="66">(USB Webcam)</text>

  <rect class="box" x="280" y="20" width="190" height="70"/>
  <text class="lbl" x="375" y="45">Companion Computer</text>
  <text class="lbl" x="375" y="66">(Arduino UNO Q)</text>

  <rect class="box" x="515" y="20" width="190" height="70"/>
  <text class="lbl" x="610" y="45">Flight Intent</text>
  <text class="lbl" x="610" y="66">(JSON Output)</text>

  <!-- Row B: control -->
  <rect class="box" x="45" y="190" width="190" height="70"/>
  <text class="lbl" x="140" y="215">RC Receiver</text>
  <text class="lbl" x="140" y="236">(Manual Control)</text>

  <rect class="box" x="280" y="190" width="190" height="70"/>
  <text class="lbl" x="375" y="215">Flight Controller</text>
  <text class="lbl" x="375" y="236">(Pixhawk + PX4)</text>

  <!-- Row C: power and drive -->
  <rect class="box" x="45" y="360" width="190" height="70"/>
  <text class="lbl" x="140" y="385">Flight Battery</text>
  <text class="lbl" x="140" y="406">(LiPo)</text>

  <rect class="box" x="280" y="360" width="190" height="70"/>
  <text class="lbl" x="375" y="385">Power Distribution</text>
  <text class="lbl" x="375" y="406">(Matek PDB-XT60)</text>

  <rect class="box" x="515" y="360" width="190" height="70"/>
  <text class="lbl" x="610" y="385">ESCs</text>
  <text class="lbl" x="610" y="406">(x4)</text>

  <!-- Row D -->
  <rect class="box" x="515" y="470" width="190" height="70"/>
  <text class="lbl" x="610" y="495">Brushless Motors</text>
  <text class="lbl" x="610" y="516">(x4)</text>

  <!-- Connectors -->
  <path class="wire" d="M235,55 L276,55" marker-end="url(#head)"/>
  <path class="wire" d="M470,55 L511,55" marker-end="url(#head)"/>
  <path class="dash" d="M610,90 L610,225 L476,225" marker-end="url(#head)"/>
  <text class="note" x="546" y="208">Planned link</text>
  <path class="wire" d="M235,225 L276,225" marker-end="url(#head)"/>
  <path class="wire" d="M375,260 L375,305 L610,305 L610,356" marker-end="url(#head)"/>
  <path class="wire" d="M235,395 L276,395" marker-end="url(#head)"/>
  <path class="wire" d="M470,395 L511,395" marker-end="url(#head)"/>
  <path class="wire" d="M610,430 L610,466" marker-end="url(#head)"/>
</svg>
