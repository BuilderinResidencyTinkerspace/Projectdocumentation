<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <!-- Components grid: ARGUS person-tracking drone. Black line drawings on white, 5 x 2 grid, bold label under each. -->
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .o   { fill: #ffffff; stroke: #000000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .t   { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .f   { fill: #000000; }
      .lbl { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 13.5px;
             fill: #000000; text-anchor: middle; letter-spacing: 0.4px; }
      .in  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11px;
             fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="500"/>

  <!-- 1. Arduino UNO Q -->
  <rect class="o" x="14" y="98" width="12" height="16" rx="2"/>
  <rect class="o" x="22" y="68" width="108" height="74" rx="7"/>
  <rect class="t" x="42" y="73" width="82" height="7"/>
  <rect class="t" x="34" y="131" width="78" height="7"/>
  <rect class="o" x="56" y="90" width="32" height="30" rx="2"/>
  <text class="in" x="72" y="106">QRB</text>
  <rect class="o" x="96" y="94" width="20" height="20" rx="2"/>
  <circle class="t" cx="30" cy="76" r="3"/><circle class="t" cx="122" cy="134" r="3"/>
  <text class="lbl" x="75" y="205">ARDUINO UNO Q</text>

  <!-- 2. Raspberry Pi 5 -->
  <rect class="o" x="160" y="68" width="114" height="78" rx="7"/>
  <rect class="t" x="170" y="73" width="86" height="11"/>
  <path class="t" d="M174,78.5 L252,78.5" stroke-dasharray="2 4"/>
  <rect class="o" x="196" y="100" width="30" height="30" rx="2"/>
  <rect class="o" x="266" y="78" width="24" height="20" rx="2"/>
  <rect class="o" x="266" y="102" width="24" height="20" rx="2"/>
  <rect class="o" x="264" y="126" width="26" height="18" rx="2"/>
  <circle class="t" cx="168" cy="76" r="3"/><circle class="t" cx="168" cy="138" r="3"/>
  <circle class="t" cx="250" cy="138" r="3"/>
  <text class="lbl" x="225" y="205">RASPBERRY PI 5</text>

  <!-- 3. Pixhawk 2.4.8 -->
  <rect class="o" x="318" y="70" width="106" height="70" rx="12"/>
  <rect class="o" x="422" y="80" width="14" height="50" rx="2"/>
  <path class="t" d="M426,88 L432,88 M426,96 L432,96 M426,104 L432,104 M426,112 L432,112 M426,120 L432,120"/>
  <text x="370" y="104" font-family="Arial, 'Liberation Sans', sans-serif" font-weight="700" font-style="italic" font-size="17" text-anchor="middle" fill="#000000">pixhawk</text>
  <text class="in" x="370" y="122">2.4.8</text>
  <circle class="t" cx="334" cy="84" r="4"/>
  <text class="lbl" x="375" y="205">PIXHAWK 2.4.8</text>

  <!-- 4. M10 GPS module -->
  <circle class="o" cx="525" cy="105" r="46"/>
  <circle class="t" cx="525" cy="105" r="36"/>
  <path class="f" d="M525,74 L532,86 L518,86 Z"/>
  <text class="in" x="525" y="104" font-size="14">GPS</text>
  <text class="in" x="525" y="122">M10</text>
  <text class="lbl" x="525" y="205">M10 GPS MODULE</text>

  <!-- 5. Matek PDB-XT60 -->
  <rect class="o" x="628" y="65" width="80" height="80" rx="5"/>
  <rect class="t" x="634" y="71" width="9" height="13"/><rect class="t" x="693" y="71" width="9" height="13"/>
  <rect class="t" x="634" y="126" width="9" height="13"/><rect class="t" x="693" y="126" width="9" height="13"/>
  <rect class="o" x="656" y="92" width="24" height="24" rx="2"/>
  <path class="o" d="M708,92 L732,92 L742,100 L742,112 L732,120 L708,120 Z"/>
  <text class="in" x="725" y="106" font-size="9">XT60</text>
  <text class="lbl" x="675" y="205">MATEK PDB-XT60</text>

  <!-- 6. ESC -->
  <path class="t" d="M12,345 L30,345" stroke-width="3"/>
  <path class="t" d="M12,355 L30,355" stroke-width="3"/>
  <path class="t" d="M14,366 C20,366 24,364 30,364"/>
  <rect class="o" x="30" y="333" width="82" height="42" rx="10"/>
  <text class="in" x="71" y="355">ESC</text>
  <path class="t" d="M112,343 L138,343 M112,354 L138,354 M112,365 L138,365"/>
  <circle class="f" cx="139" cy="343" r="2.5"/><circle class="f" cx="139" cy="354" r="2.5"/><circle class="f" cx="139" cy="365" r="2.5"/>
  <text class="lbl" x="75" y="455">ESC ×4</text>

  <!-- 7. A2212 1000KV motor -->
  <path class="o" d="M225,292 L225,312"/>
  <rect class="o" x="197" y="312" width="56" height="50" rx="5"/>
  <path class="t" d="M197,322 L253,322 M197,352 L253,352"/>
  <text class="in" x="225" y="337" font-size="10">A2212</text>
  <rect class="o" x="205" y="362" width="40" height="12" rx="2"/>
  <rect class="o" x="188" y="374" width="74" height="7" rx="2"/>
  <text class="lbl" x="225" y="455">A2212 1000KV ×4</text>

  <!-- 8. Propeller -->
  <path class="o" d="M383,351 C410,337 446,336 458,346 C447,358 411,365 383,359 Z"/>
  <path class="o" d="M367,359 C340,373 304,374 292,364 C303,352 339,345 367,351 Z"/>
  <circle class="o" cx="375" cy="355" r="10"/>
  <circle class="f" cx="375" cy="355" r="3"/>
  <text class="lbl" x="375" y="455">PROPELLER ×4</text>

  <!-- 9. USB webcam -->
  <path class="t" d="M560,348 C582,348 586,372 604,374"/>
  <rect class="o" x="489" y="318" width="72" height="54" rx="9"/>
  <circle class="o" cx="525" cy="345" r="18"/>
  <circle class="t" cx="525" cy="345" r="11"/>
  <circle class="f" cx="525" cy="345" r="4.5"/>
  <rect class="o" x="519" y="372" width="12" height="8"/>
  <rect class="o" x="503" y="380" width="44" height="7" rx="2"/>
  <text class="lbl" x="525" y="455">USB WEBCAM</text>

  <!-- 10. LiPo battery -->
  <path class="t" d="M640,330 L640,318"/>
  <rect class="o" x="632" y="309" width="16" height="9" rx="1"/>
  <rect class="o" x="612" y="330" width="104" height="50" rx="6"/>
  <text class="in" x="664" y="355" font-size="15">LiPo</text>
  <path class="t" d="M716,346 L728,346 M716,364 L728,364" stroke-width="3"/>
  <rect class="o" x="728" y="340" width="14" height="30" rx="2"/>
  <text class="lbl" x="675" y="455">LIPO BATTERY</text>
</svg>
