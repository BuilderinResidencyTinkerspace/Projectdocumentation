<svg xmlns="http://www.w3.org/2000/svg" width="750" height="540" viewBox="0 0 750 540">
  <!--
    Block diagram: Blister Bot medicine dispenser prototype (digestdocs, CircuitDigest style)
    Inputs (mic, two USB cameras) feed the Linux side of the Arduino UNO Q, which runs the AI models.
    The Linux side sends X/Y/Z step commands over a local socket (port 7500) to the STM32 sketch,
    which drives three stepper drivers and three 28BYJ-48 motors. The wheel motor is not in the firmware yet (dashed).
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 3; }
      .dbox { fill: #ffffff; stroke: #000000; stroke-width: 3; stroke-dasharray: 10 7; }
      .wire { fill: none; stroke: #000000; stroke-width: 4; stroke-linejoin: miter; }
      .dash { fill: none; stroke: #000000; stroke-width: 4; stroke-dasharray: 11 8; }
      .lbl  { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="750" height="540"/>
  <g id="watermark" opacity="0.10"></g>

  <!-- Inputs -->
  <rect class="box" x="20" y="20" width="180" height="60"/>
  <text class="lbl" x="110" y="41">Microphone</text>
  <text class="lbl" x="110" y="61">(USB)</text>

  <rect class="box" x="20" y="120" width="180" height="60"/>
  <text class="lbl" x="110" y="141">Camera 1</text>
  <text class="lbl" x="110" y="161">(Face ID and OCR)</text>

  <rect class="box" x="20" y="220" width="180" height="60"/>
  <text class="lbl" x="110" y="241">Camera 2</text>
  <text class="lbl" x="110" y="261">(Pill Targeting)</text>

  <!-- Linux side of the UNO Q -->
  <rect class="box" x="265" y="20" width="220" height="260"/>
  <text class="lbl" x="375" y="48">Arduino UNO Q</text>
  <text class="lbl" x="375" y="68">(Linux side, QRB2210)</text>
  <text class="note" x="375" y="112">Sherpa-ONNX speech-to-text</text>
  <text class="note" x="375" y="137">Qwen 2.5 0.5B language model</text>
  <text class="note" x="375" y="162">Piper text-to-speech</text>
  <text class="note" x="375" y="187">SAM 2.1 + OpenCV contours</text>
  <text class="note" x="375" y="212">LBPH face recognition</text>
  <text class="note" x="375" y="237">SQLite patient records</text>

  <!-- Outputs from the Linux side -->
  <rect class="box" x="550" y="20" width="180" height="60"/>
  <text class="lbl" x="640" y="41">Audio Output</text>
  <text class="lbl" x="640" y="61">(Wired Earphone)</text>

  <rect class="box" x="550" y="120" width="180" height="60"/>
  <text class="lbl" x="640" y="141">Web Page</text>
  <text class="lbl" x="640" y="161">(Phone or Laptop)</text>

  <!-- MCU side and motion -->
  <rect class="box" x="265" y="330" width="220" height="60"/>
  <text class="lbl" x="375" y="351">MCU side (STM32U585)</text>
  <text class="lbl" x="375" y="371">(cnc_plotter.ino)</text>

  <rect class="dbox" x="550" y="330" width="180" height="60"/>
  <text class="lbl" x="640" y="351">Wheel Motor</text>
  <text class="lbl" x="640" y="371">(not in firmware yet)</text>

  <rect class="box" x="20" y="450" width="180" height="60"/>
  <text class="lbl" x="110" y="471">Motor Supply</text>
  <text class="lbl" x="110" y="491">(6V, 4 x AA)</text>

  <rect class="box" x="265" y="450" width="220" height="60"/>
  <text class="lbl" x="375" y="471">Stepper Drivers (x3)</text>
  <text class="lbl" x="375" y="491">(L293D or ULN2003)</text>

  <rect class="box" x="550" y="450" width="180" height="60"/>
  <text class="lbl" x="640" y="471">Stepper Motors</text>
  <text class="lbl" x="640" y="491">(3 x 28BYJ-48: X, Y, Z)</text>

  <!-- Connectors -->
  <path class="wire" d="M200,50 L261,50" marker-end="url(#head)"/>
  <path class="wire" d="M200,150 L261,150" marker-end="url(#head)"/>
  <path class="wire" d="M200,250 L261,250" marker-end="url(#head)"/>
  <path class="wire" d="M485,50 L546,50" marker-end="url(#head)"/>
  <path class="wire" d="M489,150 L546,150" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="note" x="517" y="135">Wi-Fi</text>

  <path class="wire" d="M375,280 L375,326" marker-end="url(#head)"/>
  <text class="note" x="436" y="303">socket 7500</text>
  <path class="dash" d="M485,360 L546,360" marker-end="url(#head)"/>
  <path class="wire" d="M375,390 L375,446" marker-end="url(#head)"/>
  <text class="note" x="429" y="418">IN1 to IN4</text>
  <path class="wire" d="M200,480 L261,480" marker-end="url(#head)"/>
  <path class="wire" d="M485,480 L546,480" marker-end="url(#head)"/>
</svg>
