<svg xmlns="http://www.w3.org/2000/svg" width="750" height="590" viewBox="0 0 750 590">
  <!--
    Wiring diagram: Blister Bot. Black on white.
    From docs/connections.md and the firmware (cnc_plotter.ino): X driver IN1-IN4 on D2-D5, Y on D6-D9,
    Z on D10-D13; every driver's + and - on the breadboard rails fed by a 6V 4xAA pack; UNO Q GND tied to the rails.
    The README later names three L293D drivers; connections.md describes ULN2003-style boards. Same pin map.
    The USB-C hub and the earphone connection are not recorded in the repo.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .dbox { fill: #ffffff; stroke: #000000; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .w    { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .bus  { fill: none; stroke: #000000; stroke-width: 5; stroke-linejoin: miter; }
      .thin { fill: none; stroke: #000000; stroke-width: 1.4; stroke-linecap: round; }
      .lbl  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 13.5px;
              fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .sm   { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11px;
              fill: #000000; dominant-baseline: middle; }
      .note { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-size: 12px; font-style: italic;
              fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .dot  { fill: #000000; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="590"/>

  <!-- USB-C hub (not recorded) -->
  <rect class="dbox" x="230" y="10" width="300" height="44" rx="4"/>
  <text class="lbl" x="380" y="26">USB-C HUB (MODEL NOT RECORDED)</text>
  <text class="sm" x="380" y="43" text-anchor="middle">5V power · Camera 1 · Camera 2 · USB mic</text>
  <path class="w" d="M380,54 L380,76"/>

  <!-- Arduino UNO Q -->
  <rect class="box" x="160" y="76" width="460" height="88" rx="5"/>
  <text class="lbl" x="390" y="98" style="font-size:16px">ARDUINO UNO Q</text>
  <text class="sm" x="390" y="117" text-anchor="middle">STM32 side runs cnc_plotter.ino</text>
  <text class="sm" x="220" y="148" text-anchor="middle">D2-D5</text>
  <text class="sm" x="335" y="148" text-anchor="middle">D6-D9</text>
  <text class="sm" x="565" y="148" text-anchor="middle">D10-D13</text>
  <text class="sm" x="168" y="120">GND</text>
  <circle class="dot" cx="220" cy="164" r="4"/><circle class="dot" cx="335" cy="164" r="4"/>
  <circle class="dot" cx="565" cy="164" r="4"/><circle class="dot" cx="160" cy="120" r="4"/>

  <!-- Signal buses (4 wires each) -->
  <path class="bus" d="M220,164 L220,198 L105,198 L105,236"/>
  <path class="bus" d="M335,164 L335,236"/>
  <path class="bus" d="M565,164 L565,236"/>
  <text class="sm" x="112" y="214">IN1-IN4</text>
  <text class="sm" x="342" y="200">IN1-IN4</text>
  <text class="sm" x="572" y="200">IN1-IN4</text>

  <!-- Drivers -->
  <rect class="box" x="40" y="236" width="130" height="62" rx="4"/>
  <text class="lbl" x="105" y="258">X DRIVER</text>
  <text class="sm" x="105" y="280" text-anchor="middle">pins 2, 3, 4, 5</text>
  <rect class="box" x="270" y="236" width="130" height="62" rx="4"/>
  <text class="lbl" x="335" y="258">Y DRIVER</text>
  <text class="sm" x="335" y="280" text-anchor="middle">pins 6, 7, 8, 9</text>
  <rect class="box" x="500" y="236" width="130" height="62" rx="4"/>
  <text class="lbl" x="565" y="258">Z DRIVER</text>
  <text class="sm" x="565" y="280" text-anchor="middle">pins 10, 11, 12, 13</text>

  <!-- Motors with 5-wire leads -->
  <path class="thin" d="M170,259 L194,259 M170,263 L194,263 M170,267 L194,267 M170,271 L194,271 M170,275 L194,275"/>
  <circle class="box" cx="220" cy="267" r="26"/>
  <text class="lbl" x="220" y="267">X</text>
  <path class="thin" d="M400,259 L424,259 M400,263 L424,263 M400,267 L424,267 M400,271 L424,271 M400,275 L424,275"/>
  <circle class="box" cx="450" cy="267" r="26"/>
  <text class="lbl" x="450" y="267">Y</text>
  <path class="thin" d="M630,259 L659,259 M630,263 L659,263 M630,267 L659,267 M630,271 L659,271 M630,275 L659,275"/>
  <circle class="box" cx="685" cy="267" r="26"/>
  <text class="lbl" x="685" y="267">Z</text>
  <text class="sm" x="738" y="312" text-anchor="end">28BYJ-48 5V steppers</text>
  <text class="sm" x="738" y="327" text-anchor="end">(Z pushes the drill)</text>

  <!-- Power from each driver to the breadboard rails -->
  <path class="w" d="M99,298 L99,450 M111,298 L111,450"/>
  <path class="w" d="M329,298 L329,450 M341,298 L341,450"/>
  <path class="w" d="M559,298 L559,450 M571,298 L571,450"/>
  <text class="sm" x="118" y="380">+ / −</text>
  <text class="sm" x="348" y="380">+ / −</text>
  <text class="sm" x="578" y="380">+ / −</text>

  <!-- Breadboard rails -->
  <rect class="box" x="60" y="450" width="560" height="44" rx="4"/>
  <text class="lbl" x="340" y="466">BREADBOARD RAILS</text>
  <text class="sm" x="340" y="483" text-anchor="middle">+6V rail and common GND rail</text>

  <!-- UNO Q GND to the rails (common ground) -->
  <path class="w" d="M160,120 L20,120 L20,472 L60,472"/>
  <text class="sm" x="12" y="300" text-anchor="middle" transform="rotate(-90 12 300)">COMMON GND</text>

  <!-- Battery -->
  <rect class="box" x="640" y="440" width="96" height="64" rx="4"/>
  <text class="lbl" x="688" y="462">6V PACK</text>
  <text class="sm" x="688" y="484" text-anchor="middle">4 x AA</text>
  <path class="w" d="M620,466 L640,466 M620,478 L640,478"/>

  <!-- Notes and legend -->
  <text class="note" x="375" y="522">Drivers: three L293D boards in the README, ULN2003-style boards in connections.md. The pin map is the same.</text>
  <text class="note" x="375" y="540">Never power the steppers from the UNO Q's 5V pin. The medicine wheel motor is not wired yet.</text>
  <path class="bus" d="M40,570 L80,570"/><text class="sm" x="88" y="570">4-wire signal bus</text>
  <path class="w" d="M220,570 L260,570"/><text class="sm" x="268" y="570">Power / GND</text>
  <path class="thin" d="M380,566 L420,566 M380,570 L420,570 M380,574 L420,574"/><text class="sm" x="428" y="570">Motor lead (5 wires)</text>
  <path class="w" d="M560,570 L600,570" stroke-dasharray="8 6"/><text class="sm" x="608" y="570">Not recorded</text>
</svg>
