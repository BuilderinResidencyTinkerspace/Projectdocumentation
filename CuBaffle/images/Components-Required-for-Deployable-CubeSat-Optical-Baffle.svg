<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <!-- Components grid: CuBaffle deployable optical baffle. Black line drawings on white, 4 x 2 grid, bold label under each. -->
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .o   { fill: #ffffff; stroke: #000000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .t   { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .f   { fill: #000000; }
      .lbl { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 13.5px;
             fill: #000000; text-anchor: middle; letter-spacing: 0.4px; }
      .in  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11px;
             fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="500"/>

  <!-- 1. Raspberry Pi 5 (centre x 94) -->
  <rect class="o" x="26" y="70" width="128" height="88" rx="7"/>
  <rect class="t" x="36" y="75" width="98" height="10"/>
  <path class="t" d="M40,80 L130,80" stroke-dasharray="2 4"/>
  <rect class="o" x="62" y="100" width="34" height="34" rx="2"/>
  <text class="in" x="79" y="117">BCM</text>
  <rect class="o" x="148" y="88" width="22" height="20" rx="2"/>
  <rect class="o" x="148" y="114" width="22" height="20" rx="2"/>
  <rect class="o" x="146" y="138" width="24" height="16" rx="2"/>
  <circle class="t" cx="34" cy="78" r="3"/><circle class="t" cx="34" cy="150" r="3"/>
  <rect class="t" x="108" y="138" width="24" height="12"/>
  <text class="lbl" x="94" y="205">RASPBERRY PI 5</text>

  <!-- 2. Pi Camera Module 3 (centre x 281) -->
  <rect class="o" x="246" y="66" width="70" height="70" rx="5"/>
  <rect class="o" x="263" y="83" width="36" height="36" rx="3"/>
  <circle class="o" cx="281" cy="101" r="13"/>
  <circle class="f" cx="281" cy="101" r="5"/>
  <circle class="t" cx="254" cy="74" r="3"/><circle class="t" cx="308" cy="74" r="3"/>
  <circle class="t" cx="254" cy="128" r="3"/><circle class="t" cx="308" cy="128" r="3"/>
  <rect class="o" x="266" y="136" width="30" height="38"/>
  <path class="t" d="M272,140 L272,170 M278,140 L278,170 M284,140 L284,170 M290,140 L290,170"/>
  <text class="lbl" x="281" y="205">PI CAMERA MODULE 3</text>

  <!-- 3. MG90S servo (centre x 469) -->
  <rect class="o" x="424" y="108" width="90" height="9" rx="2"/>
  <rect class="o" x="434" y="92" width="70" height="62" rx="3"/>
  <circle class="t" cx="429" cy="112" r="2.5"/><circle class="t" cx="509" cy="112" r="2.5"/>
  <rect class="o" x="444" y="80" width="18" height="12" rx="2"/>
  <circle class="o" cx="453" cy="76" r="6"/>
  <path class="o" d="M453,70 L500,62 L501,72 L455,82 Z"/>
  <circle class="f" cx="453" cy="76" r="2"/>
  <text class="in" x="476" y="130">MG90S</text>
  <path class="t" d="M504,146 C522,150 526,162 540,166 M504,141 C524,146 530,158 544,160"/>
  <text class="lbl" x="469" y="205">MG90S SERVO ×2</text>

  <!-- 4. 4xAA battery holder (centre x 656) -->
  <rect class="o" x="596" y="76" width="118" height="80" rx="5"/>
  <rect class="o" x="604" y="84" width="102" height="14" rx="7"/>
  <rect class="o" x="604" y="102" width="102" height="14" rx="7"/>
  <rect class="o" x="604" y="120" width="102" height="14" rx="7"/>
  <rect class="o" x="604" y="138" width="102" height="14" rx="7"/>
  <path class="t" d="M700,91 L706,91 M703,88 L703,94"/>
  <path class="t" d="M610,109 L616,109"/>
  <path class="t" d="M714,128 C730,130 732,146 742,150 M714,136 C726,140 728,156 738,162"/>
  <text class="lbl" x="656" y="205">4×AA BATTERY HOLDER</text>

  <!-- 5. Pi 5 power supply (centre x 94) -->
  <rect class="o" x="56" y="282" width="76" height="66" rx="8"/>
  <rect class="o" x="74" y="268" width="8" height="14"/>
  <rect class="o" x="106" y="268" width="8" height="14"/>
  <text class="in" x="94" y="315">5V</text>
  <path class="t" d="M94,348 C94,372 70,370 64,388"/>
  <rect class="o" x="54" y="388" width="20" height="14" rx="4"/>
  <rect class="t" x="58" y="402" width="12" height="6" rx="2"/>
  <text class="lbl" x="94" y="440">PI 5 POWER SUPPLY</text>

  <!-- 6. Acrylic sheet (centre x 281) -->
  <path class="o" d="M206,380 L250,290 L356,290 L312,380 Z"/>
  <path class="t" d="M236,368 L262,312 L332,312 L306,368 Z" stroke-dasharray="6 5"/>
  <path class="t" d="M312,380 L316,386 L360,296 L356,290"/>
  <text class="lbl" x="281" y="430">2.88 mm ACRYLIC</text>
  <text class="lbl" x="281" y="448">SHEET</text>

  <!-- 7. Filament spool (centre x 469) -->
  <circle class="o" cx="469" cy="335" r="48"/>
  <circle class="t" cx="469" cy="335" r="38"/>
  <circle class="t" cx="469" cy="335" r="30"/>
  <circle class="t" cx="469" cy="335" r="22"/>
  <circle class="o" cx="469" cy="335" r="12"/>
  <path class="t" d="M507,358 C520,368 526,380 540,384"/>
  <text class="lbl" x="469" y="430">3D PRINTER</text>
  <text class="lbl" x="469" y="448">FILAMENT</text>

  <!-- 8. Perf board (centre x 656) -->
  <rect class="o" x="600" y="290" width="112" height="90" rx="4"/>
  <g class="f">
    <circle cx="614" cy="304" r="2"/><circle cx="628" cy="304" r="2"/><circle cx="642" cy="304" r="2"/><circle cx="656" cy="304" r="2"/><circle cx="670" cy="304" r="2"/><circle cx="684" cy="304" r="2"/><circle cx="698" cy="304" r="2"/>
    <circle cx="614" cy="318" r="2"/><circle cx="628" cy="318" r="2"/><circle cx="642" cy="318" r="2"/><circle cx="656" cy="318" r="2"/><circle cx="670" cy="318" r="2"/><circle cx="684" cy="318" r="2"/><circle cx="698" cy="318" r="2"/>
    <circle cx="614" cy="332" r="2"/><circle cx="628" cy="332" r="2"/><circle cx="642" cy="332" r="2"/><circle cx="656" cy="332" r="2"/><circle cx="670" cy="332" r="2"/><circle cx="684" cy="332" r="2"/><circle cx="698" cy="332" r="2"/>
    <circle cx="614" cy="346" r="2"/><circle cx="628" cy="346" r="2"/><circle cx="642" cy="346" r="2"/><circle cx="656" cy="346" r="2"/><circle cx="670" cy="346" r="2"/><circle cx="684" cy="346" r="2"/><circle cx="698" cy="346" r="2"/>
    <circle cx="614" cy="360" r="2"/><circle cx="628" cy="360" r="2"/><circle cx="642" cy="360" r="2"/><circle cx="656" cy="360" r="2"/><circle cx="670" cy="360" r="2"/><circle cx="684" cy="360" r="2"/><circle cx="698" cy="360" r="2"/>
  </g>
  <rect class="t" x="622" y="312" width="40" height="12"/>
  <text class="lbl" x="656" y="430">PERF BOARD</text>
</svg>
