<svg xmlns="http://www.w3.org/2000/svg" width="750" height="420" viewBox="0 0 750 420">
  <!--
    Block diagram: CuBaffle deployable optical baffle (digestdocs, CircuitDigest style)
    The Raspberry Pi 5 runs the Flask dashboard and drives both MG90S servos from one hardware PWM pin.
    The servos run from their own 4xAA pack; the Pi has its own supply. The Pi camera looks up through
    the baffle, and any phone or laptop on the same Wi-Fi opens the dashboard.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 3; }
      .wire { fill: none; stroke: #000000; stroke-width: 4; stroke-linejoin: miter; }
      .dash { fill: none; stroke: #000000; stroke-width: 4; stroke-dasharray: 11 8; }
      .lbl  { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="750" height="420"/>
  <g id="watermark" opacity="0.10"></g>

  <!-- Row A: power -->
  <rect class="box" x="265" y="20" width="220" height="70"/>
  <text class="lbl" x="375" y="45">Pi Power Supply</text>
  <text class="lbl" x="375" y="66">(Official Pi 5 Adapter)</text>

  <rect class="box" x="550" y="20" width="180" height="70"/>
  <text class="lbl" x="640" y="45">Servo Battery</text>
  <text class="lbl" x="640" y="66">(4 x AA, 6V)</text>

  <!-- Row B -->
  <rect class="box" x="20" y="170" width="180" height="70"/>
  <text class="lbl" x="110" y="195">Dashboard</text>
  <text class="lbl" x="110" y="216">(Phone or Laptop)</text>

  <rect class="box" x="265" y="170" width="220" height="70"/>
  <text class="lbl" x="375" y="195">Controller</text>
  <text class="lbl" x="375" y="216">(Raspberry Pi 5 + Flask)</text>

  <rect class="box" x="550" y="170" width="180" height="70"/>
  <text class="lbl" x="640" y="195">Actuators</text>
  <text class="lbl" x="640" y="216">(2 x MG90S Servos)</text>

  <!-- Row C -->
  <rect class="box" x="20" y="330" width="180" height="70"/>
  <text class="lbl" x="110" y="355">Camera</text>
  <text class="lbl" x="110" y="376">(Pi Camera Module 3)</text>

  <rect class="box" x="550" y="330" width="180" height="70"/>
  <text class="lbl" x="640" y="355">3-Stage Baffle</text>
  <text class="lbl" x="640" y="376">(Pushed by Servo Arms)</text>

  <!-- Connectors -->
  <path class="wire" d="M375,90 L375,166" marker-end="url(#head)"/>
  <text class="note" x="402" y="128">5V</text>

  <path class="wire" d="M640,90 L640,166" marker-end="url(#head)"/>
  <text class="note" x="667" y="128">6V</text>

  <path class="wire" d="M204,205 L261,205" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="note" x="232" y="190">Wi-Fi</text>

  <path class="wire" d="M485,205 L546,205" marker-end="url(#head)"/>
  <text class="note" x="516" y="190">PWM</text>
  <text class="note" x="516" y="222">pin 32</text>

  <path class="wire" d="M640,240 L640,326" marker-end="url(#head)"/>
  <text class="note" x="682" y="284">arms</text>

  <path class="wire" d="M200,350 L235,350 L235,228 L261,228" marker-end="url(#head)"/>
  <text class="note" x="262" y="300">CSI</text>

  <path class="dash" d="M550,385 L204,385" marker-end="url(#head)"/>
  <text class="note" x="377" y="370">Camera looks up through the baffle</text>
</svg>
