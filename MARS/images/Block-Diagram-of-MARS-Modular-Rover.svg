<svg xmlns="http://www.w3.org/2000/svg" width="750" height="610" viewBox="0 0 750 610">
  <!--
    Block diagram: MARS modular autonomous rover system (digestdocs, CircuitDigest style)
    Top: base rover (phone -> HC-05 -> Arduino Uno -> L298N -> 4 BO motors, 3 HC-SR04, 14.8V pack + buck).
    Bottom: the two application modules, each with its own controller. The logs describe
    no data link between a module and the base.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 3; }
      .wire { fill: none; stroke: #000000; stroke-width: 4; stroke-linejoin: miter; }
      .sep  { fill: none; stroke: #000000; stroke-width: 1.6; stroke-dasharray: 4 6; }
      .lbl  { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .head { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 14px; fill: #000000; letter-spacing: 1px; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="750" height="610"/>
  <g id="watermark" opacity="0.10"></g>

  <text class="head" x="20" y="16">BASE ROVER</text>

  <!-- Row A -->
  <rect class="box" x="20" y="30" width="180" height="70"/>
  <text class="lbl" x="110" y="55">Phone App</text>
  <text class="lbl" x="110" y="76">(Bluetooth Terminal)</text>

  <rect class="box" x="265" y="30" width="220" height="70"/>
  <text class="lbl" x="375" y="55">Bluetooth Module</text>
  <text class="lbl" x="375" y="76">(HC-05)</text>

  <rect class="box" x="550" y="30" width="180" height="70"/>
  <text class="lbl" x="640" y="55">Power</text>
  <text class="lbl" x="640" y="76">(14.8V Li-ion + Buck)</text>

  <!-- Row B -->
  <rect class="box" x="20" y="170" width="180" height="70"/>
  <text class="lbl" x="110" y="195">Obstacle Sensors</text>
  <text class="lbl" x="110" y="216">(3 x HC-SR04)</text>

  <rect class="box" x="265" y="170" width="220" height="70"/>
  <text class="lbl" x="375" y="195">Rover Controller</text>
  <text class="lbl" x="375" y="216">(Arduino Uno)</text>

  <rect class="box" x="550" y="170" width="180" height="70"/>
  <text class="lbl" x="640" y="195">Motor Driver</text>
  <text class="lbl" x="640" y="216">(L298N)</text>

  <!-- Row C -->
  <rect class="box" x="550" y="290" width="180" height="70"/>
  <text class="lbl" x="640" y="315">Drive Motors</text>
  <text class="lbl" x="640" y="336">(4 x BO Gear Motors)</text>

  <!-- Base connectors -->
  <path class="wire" d="M200,65 L261,65" marker-end="url(#head)"/>
  <text class="note" x="232" y="50">BT</text>
  <path class="wire" d="M340,100 L340,166" marker-end="url(#head)"/>
  <text class="note" x="312" y="134">Serial</text>
  <path class="wire" d="M200,205 L261,205" marker-end="url(#head)"/>
  <path class="wire" d="M485,205 L546,205" marker-end="url(#head)"/>
  <path class="wire" d="M640,240 L640,286" marker-end="url(#head)"/>
  <path class="wire" d="M690,100 L690,166" marker-end="url(#head)"/>
  <text class="note" x="716" y="134">14.8V</text>
  <path class="wire" d="M590,100 L590,134 L430,134 L430,166" marker-end="url(#head)"/>
  <text class="note" x="510" y="120">regulated</text>

  <!-- separator -->
  <path class="sep" d="M20,385 L730,385"/>
  <text class="head" x="20" y="410">APPLICATION MODULES</text>
  <text class="note" x="520" y="406">Each module has its own controller</text>

  <!-- Camera module -->
  <rect class="box" x="20" y="425" width="180" height="70"/>
  <text class="lbl" x="110" y="450">Camera</text>
  <text class="lbl" x="110" y="471">(USB Webcam)</text>

  <rect class="box" x="265" y="425" width="220" height="70"/>
  <text class="lbl" x="375" y="450">Camera Module</text>
  <text class="lbl" x="375" y="471">(Raspberry Pi 5)</text>

  <rect class="box" x="550" y="425" width="180" height="70"/>
  <text class="lbl" x="640" y="450">Browser Page</text>
  <text class="lbl" x="640" y="471">(Live Video, Port 5000)</text>

  <path class="wire" d="M200,460 L261,460" marker-end="url(#head)"/>
  <text class="note" x="232" y="445">USB</text>
  <path class="wire" d="M485,460 L546,460" marker-end="url(#head)"/>
  <text class="note" x="516" y="445">Wi-Fi</text>

  <!-- Environmental module -->
  <rect class="box" x="20" y="525" width="180" height="70"/>
  <text class="lbl" x="110" y="550">Sensors</text>
  <text class="lbl" x="110" y="571">(MQ Gas, DHT11, Soil)</text>

  <rect class="box" x="265" y="525" width="220" height="70"/>
  <text class="lbl" x="375" y="550">Environmental Module</text>
  <text class="lbl" x="375" y="571">(Arduino Nano)</text>

  <rect class="box" x="550" y="525" width="180" height="70"/>
  <text class="lbl" x="640" y="550">Probe Lift</text>
  <text class="lbl" x="640" y="571">(Servo Motor)</text>

  <path class="wire" d="M200,560 L261,560" marker-end="url(#head)"/>
  <path class="wire" d="M485,560 L546,560" marker-end="url(#head)"/>
</svg>
