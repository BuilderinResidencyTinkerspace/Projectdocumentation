<svg xmlns="http://www.w3.org/2000/svg" width="750" height="600" viewBox="0 0 750 600">
  <!-- Components grid: MARS modular rover. Black line drawings on white, 5 x 3 grid, bold label under each.
       Row 1 and 2: base rover. Row 3: environmental module (the Pi 5 and webcam sit in row 2). -->
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .o   { fill: #ffffff; stroke: #000000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .t   { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .f   { fill: #000000; }
      .lbl { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 12px;
             fill: #000000; text-anchor: middle; letter-spacing: 0.4px; }
      .in  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 10.5px;
             fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="600"/>

  <!-- ===== Row 1 (icons y 40..130, labels y 160) ===== -->
  <!-- 1. Arduino Uno (cx 75) -->
  <rect class="o" x="22" y="58" width="106" height="72" rx="6"/>
  <rect class="o" x="14" y="70" width="18" height="20" rx="2"/>
  <rect class="o" x="16" y="100" width="14" height="18" rx="2"/>
  <rect class="t" x="44" y="62" width="76" height="7"/>
  <rect class="t" x="52" y="120" width="68" height="7"/>
  <rect class="o" x="66" y="84" width="32" height="20" rx="2"/>
  <text class="in" x="82" y="94">UNO</text>
  <text class="lbl" x="75" y="162">ARDUINO UNO</text>

  <!-- 2. L298N (cx 225) -->
  <rect class="o" x="180" y="60" width="90" height="72" rx="4"/>
  <path class="o" d="M204,60 L204,40 L246,40 L246,60"/>
  <path class="t" d="M210,40 L210,52 M218,40 L218,52 M226,40 L226,52 M234,40 L234,52 M242,40 L242,52"/>
  <rect class="o" x="184" y="108" width="20" height="18" rx="2"/>
  <rect class="o" x="246" y="108" width="20" height="18" rx="2"/>
  <rect class="o" x="210" y="112" width="30" height="14" rx="2"/>
  <text class="in" x="225" y="88">L298N</text>
  <text class="lbl" x="225" y="162">L298N DRIVER</text>

  <!-- 3. HC-05 (cx 375) -->
  <rect class="o" x="322" y="72" width="96" height="40" rx="4"/>
  <path class="t" d="M330,80 L330,104 L338,104 L338,84 L346,84 L346,104"/>
  <rect class="o" x="358" y="82" width="22" height="20" rx="2"/>
  <path class="t" d="M418,80 L432,80 M418,88 L432,88 M418,96 L432,96 M418,104 L432,104"/>
  <text class="in" x="398" y="92">HC-05</text>
  <text class="lbl" x="375" y="162">HC-05 BLUETOOTH</text>

  <!-- 4. HC-SR04 x3 (cx 525) -->
  <rect class="o" x="472" y="68" width="106" height="48" rx="4"/>
  <circle class="o" cx="498" cy="92" r="17"/><circle class="o" cx="498" cy="92" r="9"/>
  <circle class="o" cx="552" cy="92" r="17"/><circle class="o" cx="552" cy="92" r="9"/>
  <path class="t" d="M515,116 L515,128 M521,116 L521,128 M529,116 L529,128 M535,116 L535,128"/>
  <text class="lbl" x="525" y="162">HC-SR04 ×3</text>

  <!-- 5. BO gear motor x4 (cx 675) -->
  <rect class="o" x="628" y="70" width="58" height="40" rx="4"/>
  <rect class="o" x="686" y="76" width="34" height="28" rx="12"/>
  <circle class="o" cx="652" cy="90" r="6"/>
  <path class="t" d="M657,110 L657,126 M701,104 L701,124"/>
  <text class="lbl" x="672" y="162">BO GEAR MOTOR ×4</text>

  <!-- ===== Row 2 (icons y 240..330, labels y 360) ===== -->
  <!-- 6. 65 mm wheel x4 (cx 75) -->
  <circle class="o" cx="75" cy="285" r="44"/>
  <circle class="o" cx="75" cy="285" r="28"/>
  <circle class="o" cx="75" cy="285" r="7"/>
  <path class="t" d="M75,257 L75,278 M75,292 L75,313 M47,285 L68,285 M82,285 L103,285"/>
  <text class="lbl" x="75" y="362">65 mm WHEEL ×4</text>

  <!-- 7. 14.8V Li-ion pack (cx 225) -->
  <rect class="o" x="172" y="248" width="106" height="70" rx="8"/>
  <path class="t" d="M186,256 L186,310 M264,256 L264,310" stroke-dasharray="3 4"/>
  <text class="in" x="225" y="276">14.8V</text>
  <text class="in" x="225" y="292">2200mAh</text>
  <path class="t" d="M278,270 L296,262 M278,282 L296,288"/>
  <text class="lbl" x="225" y="362">14.8V LI-ION PACK</text>

  <!-- 8. Buck converter (cx 375) -->
  <rect class="o" x="328" y="256" width="94" height="58" rx="4"/>
  <circle class="o" cx="348" cy="285" r="12"/>
  <rect class="o" x="368" y="270" width="26" height="30" rx="3"/>
  <circle class="o" cx="408" cy="285" r="9"/>
  <rect class="o" x="396" y="258" width="12" height="9" rx="1"/>
  <text class="lbl" x="375" y="362">BUCK CONVERTER</text>

  <!-- 9. Raspberry Pi 5 (cx 525) -->
  <rect class="o" x="470" y="248" width="110" height="74" rx="6"/>
  <rect class="t" x="478" y="252" width="70" height="7"/>
  <rect class="o" x="500" y="270" width="36" height="36" rx="3"/>
  <circle class="t" cx="518" cy="288" r="13"/>
  <rect class="o" x="568" y="258" width="20" height="18" rx="2"/>
  <rect class="o" x="568" y="282" width="20" height="16" rx="2"/>
  <rect class="o" x="568" y="302" width="20" height="16" rx="2"/>
  <text class="lbl" x="525" y="362">RASPBERRY PI 5</text>

  <!-- 10. USB webcam (cx 675) -->
  <rect class="o" x="636" y="254" width="62" height="52" rx="6"/>
  <circle class="o" cx="667" cy="280" r="17"/><circle class="o" cx="667" cy="280" r="8"/>
  <path class="t" d="M698,280 C716,280 712,300 722,312"/>
  <rect class="o" x="718" y="310" width="12" height="16" rx="2"/>
  <text class="lbl" x="675" y="362">USB WEBCAM</text>

  <!-- ===== Row 3 (icons y 440..530, labels y 560) ===== -->
  <!-- 11. Arduino Nano (cx 75) -->
  <rect class="o" x="24" y="466" width="102" height="40" rx="4"/>
  <path class="t" d="M30,470 L120,470 M30,502 L120,502" stroke-dasharray="2 4"/>
  <rect class="o" x="62" y="476" width="24" height="20" rx="2"/>
  <rect class="o" x="12" y="478" width="14" height="16" rx="2"/>
  <text class="in" x="104" y="486">NANO</text>
  <text class="lbl" x="75" y="562">ARDUINO NANO</text>

  <!-- 12. MQ gas sensor (cx 225) -->
  <rect class="o" x="180" y="452" width="90" height="70" rx="4"/>
  <circle class="o" cx="236" cy="487" r="26"/>
  <path class="t" d="M220,477 L252,477 M216,487 L256,487 M220,497 L252,497"/>
  <path class="t" d="M186,470 L196,470 M186,480 L196,480 M186,490 L196,490 M186,500 L196,500"/>
  <text class="lbl" x="225" y="562">MQ GAS SENSOR</text>

  <!-- 13. DHT11 (cx 375) -->
  <rect class="o" x="346" y="452" width="58" height="66" rx="4"/>
  <path class="t" d="M354,464 L396,464 M354,476 L396,476 M354,488 L396,488 M354,500 L396,500 M364,456 L364,510 M375,456 L375,510 M386,456 L386,510"/>
  <path class="t" d="M362,518 L362,532 M375,518 L375,532 M388,518 L388,532"/>
  <text class="lbl" x="375" y="562">DHT11</text>

  <!-- 14. Soil-moisture probe (cx 525) -->
  <rect class="o" x="500" y="446" width="50" height="22" rx="3"/>
  <path class="o" d="M502,468 L502,526 L514,534 L514,468 Z"/>
  <path class="o" d="M536,468 L536,534 L548,526 L548,468 Z"/>
  <text class="in" x="525" y="457">SOIL</text>
  <text class="lbl" x="525" y="562">SOIL PROBE</text>

  <!-- 15. Servo motor (cx 675) -->
  <rect class="o" x="640" y="468" width="70" height="40" rx="3"/>
  <rect class="o" x="630" y="478" width="90" height="8" rx="2"/>
  <circle class="o" cx="660" cy="462" r="7"/>
  <path class="o" d="M652,452 L700,452 L700,460 L652,460 Z"/>
  <path class="t" d="M710,500 C724,504 722,520 734,524"/>
  <text class="lbl" x="675" y="562">SERVO MOTOR</text>
</svg>
