<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <!--
    Featured image: FIORA indoor delivery robot. Black on white.
    Left: title. Right: the round prototype body with mecanum wheels below and the
    RPLIDAR A1M8 on its top deck, with dashed scan rings and a few mapped wall points.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .o    { fill: #ffffff; stroke: #000000; stroke-width: 2.5; stroke-linejoin: round; }
      .ring { fill: none; stroke: #000000; stroke-width: 2; stroke-dasharray: 9 7; }
      .t    { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .f    { fill: #000000; }
      .h1   { font-family: "Arial Black", Arial, "Liberation Sans", sans-serif; font-weight: 900; font-size: 72px; fill: #000000; letter-spacing: 3px; }
      .h2   { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 31px; fill: #000000; letter-spacing: 1.5px; }
      .sub  { font-family: Arial, "Liberation Sans", sans-serif; font-size: 15px; fill: #000000; }
      .tag  { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 12px; fill: #000000; letter-spacing: 1.2px; }
      .in   { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 11px; fill: #000000; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="500"/>

  <!-- Title -->
  <text class="h1" x="34" y="122">FIORA</text>
  <rect class="f" x="38" y="142" width="70" height="6"/>
  <text class="h2" x="36" y="194">INDOOR</text>
  <text class="h2" x="36" y="234">DELIVERY ROBOT</text>
  <text class="sub" x="38" y="282">Raspberry Pi 5  ·  RPLIDAR A1M8</text>
  <text class="sub" x="38" y="304">Arduino Uno  ·  Mecanum wheels</text>
  <text class="tag" x="38" y="462">BUILDER IN RESIDENCE  ·  TINKERSPACE</text>

  <!-- Mapped wall points behind the robot -->
  <g class="f">
    <rect x="402" y="120" width="5" height="5"/><rect x="410" y="116" width="5" height="5"/><rect x="418" y="113" width="5" height="5"/>
    <rect x="426" y="110" width="5" height="5"/><rect x="434" y="108" width="5" height="5"/><rect x="442" y="105" width="5" height="5"/>
    <rect x="450" y="103" width="5" height="5"/><rect x="458" y="101" width="5" height="5"/><rect x="466" y="99" width="5" height="5"/>
    <rect x="640" y="99" width="5" height="5"/><rect x="648" y="101" width="5" height="5"/><rect x="656" y="104" width="5" height="5"/>
    <rect x="664" y="108" width="5" height="5"/><rect x="672" y="113" width="5" height="5"/><rect x="680" y="119" width="5" height="5"/>
    <rect x="688" y="126" width="5" height="5"/><rect x="696" y="134" width="5" height="5"/><rect x="702" y="143" width="5" height="5"/>
    <rect x="708" y="152" width="5" height="5"/><rect x="712" y="162" width="5" height="5"/>
    <rect x="396" y="128" width="5" height="5"/><rect x="391" y="137" width="5" height="5"/><rect x="387" y="147" width="5" height="5"/>
  </g>

  <!-- Scan rings around the LiDAR -->
  <ellipse class="ring" cx="556" cy="198" rx="178" ry="50"/>
  <ellipse class="ring" cx="556" cy="198" rx="122" ry="32"/>

  <!-- Body: open cylinder -->
  <path class="o" d="M440,268 L440,388 A120,34 0 0 0 680,388 L680,268"/>
  <ellipse class="o" cx="560" cy="268" rx="120" ry="34"/>
  <!-- top deck plate -->
  <path class="o" d="M462,262 L640,246 L660,262 L482,280 Z"/>
  <!-- Raspberry Pi 5 on the deck -->
  <path class="o" d="M590,246 L628,243 L638,252 L600,256 Z"/>
  <circle class="t" cx="612" cy="249" r="3"/>

  <!-- RPLIDAR A1M8 on stand-offs -->
  <path class="t" d="M528,258 L528,226 M582,254 L582,224 M555,262 L555,230" stroke-width="2.2"/>
  <path class="o" d="M512,224 L560,214 L600,220 L552,230 Z"/>
  <path class="o" d="M516,184 L516,212 A40,12 0 0 0 596,212 L596,184"/>
  <ellipse class="o" cx="556" cy="184" rx="40" ry="12"/>
  <text class="in" x="556" y="205">LIDAR</text>

  <!-- Mecanum wheels under the body -->
  <g>
    <rect class="o" x="486" y="398" width="54" height="34" rx="9"/>
    <path class="t" d="M494,402 L506,428 M506,402 L518,428 M518,402 L530,428"/>
    <rect class="o" x="580" y="398" width="54" height="34" rx="9"/>
    <path class="t" d="M588,428 L600,402 M600,428 L612,402 M612,428 L624,402"/>
  </g>
  <!-- floor line -->
  <path class="t" d="M420,440 L700,440"/>
</svg>
