<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <!-- Components grid: AquaNav fish-following rover. Black line drawings on white, 5 x 2 grid, bold label under each. -->
  <defs>
