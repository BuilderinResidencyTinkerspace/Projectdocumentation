      .d   { fill: none; stroke: #000000; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .f   { fill: #000000; }
      .lbl { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 13.5px;
             fill: #000000; text-anchor: middle; letter-spacing: 0.4px; }
      .in  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11px;
             fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="500"/>
  <!-- 1. Raspberry Pi 5 -->
