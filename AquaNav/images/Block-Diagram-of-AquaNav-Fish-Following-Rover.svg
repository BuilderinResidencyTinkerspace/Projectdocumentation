<svg xmlns="http://www.w3.org/2000/svg" width="750" height="560" viewBox="0 0 750 560">
  <!--
    Block diagram: AquaNav fish-following rover (digestdocs, CircuitDigest style)
    The camera watches the fish; the Raspberry Pi 5 tracks it with OpenCV, serves the dashboard,
    and sends movement commands over USB serial to the NodeMCU, which drives two L298N boards and four motors.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 3; }
      .wire { fill: none; stroke: #000000; stroke-width: 4; stroke-linejoin: miter; }
      .lbl  { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="750" height="560"/>
  <g id="watermark" opacity="0.10"></g>

  <!-- Row 1: fish, camera, Pi -->
  <rect class="box" x="20" y="20" width="180" height="70"/>
  <text class="lbl" x="110" y="45">Fish in Aquarium</text>
  <text class="lbl" x="110" y="66">(Red Betta)</text>

  <rect class="box" x="265" y="20" width="220" height="70"/>
  <text class="lbl" x="375" y="45">Camera</text>
  <text class="lbl" x="375" y="66">(Pi Camera Module 3)</text>

  <rect class="box" x="550" y="20" width="180" height="70"/>
  <text class="lbl" x="640" y="45">Vision Computer</text>
  <text class="lbl" x="640" y="66">(Raspberry Pi 5)</text>

  <!-- Row 2: dashboard, NodeMCU -->
  <rect class="box" x="265" y="185" width="220" height="70"/>
  <text class="lbl" x="375" y="210">Web Dashboard</text>
  <text class="lbl" x="375" y="231">(Laptop Browser)</text>

  <rect class="box" x="550" y="185" width="180" height="70"/>
  <text class="lbl" x="640" y="210">Motor Controller</text>
  <text class="lbl" x="640" y="231">(NodeMCU ESP8266)</text>

  <!-- Row 3: battery, drivers -->
  <rect class="box" x="20" y="340" width="180" height="70"/>
  <text class="lbl" x="110" y="365">Battery + Switch</text>
  <text class="lbl" x="110" y="386">(Li-ion Cells)</text>

  <rect class="box" x="265" y="340" width="220" height="70"/>
  <text class="lbl" x="375" y="365">Motor Drivers</text>
  <text class="lbl" x="375" y="386">(2 x L298N)</text>

  <!-- Row 4: motors -->
  <rect class="box" x="265" y="470" width="220" height="70"/>
  <text class="lbl" x="375" y="495">DC Motors and Wheels</text>
  <text class="lbl" x="375" y="516">(4 x 12V Johnson)</text>

  <!-- Connectors -->
  <path class="wire" d="M200,55 L261,55" marker-end="url(#head)"/>
  

  <path class="wire" d="M485,55 L546,55" marker-end="url(#head)"/>
  <text class="note" x="516" y="40">CSI</text>

  <path class="wire" d="M600,90 L600,135 L375,135 L375,181" marker-end="url(#head)"/>
  <text class="note" x="470" y="120">Wi-Fi, port 5000</text>

  <path class="wire" d="M680,90 L680,181" marker-end="url(#head)"/>
  <text class="note" x="712" y="150">USB</text>
  <text class="note" x="712" y="166">serial</text>

  <path class="wire" d="M640,255 L640,375 L489,375" marker-end="url(#head)"/>
  <text class="note" x="565" y="360">Direction pins</text>

  <path class="wire" d="M200,382 L261,382" marker-end="url(#head)"/>
  <text class="note" x="231" y="352">Motor</text><text class="note" x="231" y="367">power</text>

  <path class="wire" d="M375,410 L375,466" marker-end="url(#head)"/>
</svg>
