  <rect x="140" y="78" width="38" height="38" fill="url(#hatch)"/>
  <rect x="178" y="268" width="38" height="38" fill="url(#hatch)"/>
  <rect x="178" y="192" width="38" height="38" fill="url(#hatch)"/>
  <rect x="178" y="116" width="38" height="38" fill="url(#hatch)"/>
  <rect x="178" y="40" width="38" height="38" fill="url(#hatch)"/>
  <rect x="216" y="306" width="38" height="38" fill="url(#hatch)"/>
  <rect x="216" y="230" width="38" height="38" fill="url(#hatch)"/>
  <rect x="216" y="154" width="38" height="38" fill="url(#hatch)"/>
  <rect x="216" y="78" width="38" height="38" fill="url(#hatch)"/>
  <rect x="254" y="268" width="38" height="38" fill="url(#hatch)"/>
  <rect x="254" y="192" width="38" height="38" fill="url(#hatch)"/>
  <rect x="254" y="116" width="38" height="38" fill="url(#hatch)"/>
  <rect x="254" y="40" width="38" height="38" fill="url(#hatch)"/>
  <rect x="292" y="306" width="38" height="38" fill="url(#hatch)"/>
  <rect x="292" y="230" width="38" height="38" fill="url(#hatch)"/>
  <rect x="292" y="154" width="38" height="38" fill="url(#hatch)"/>
  <rect x="292" y="78" width="38" height="38" fill="url(#hatch)"/>
