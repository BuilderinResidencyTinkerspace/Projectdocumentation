<svg xmlns="http://www.w3.org/2000/svg" width="750" height="440" viewBox="0 0 750 440">
  <!-- Coordinate contract for OpenMove (firmware 2.5 onwards) and the two origin guesses it replaced (Week 8 log). -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="1.1"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .bg  { fill: #ffffff; }
      .w   { fill: none; stroke: #000000; stroke-width: 2.6; }
      .co  { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 12px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .pt  { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 11px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .hd  { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 14px; fill: #000000; letter-spacing: 0.6px; }
      .tx  { font-family: Arial, "Liberation Sans", sans-serif; font-size: 13px; fill: #000000; }
      .tb  { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 13px; fill: #000000; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="440"/>
  <rect x="64" y="306" width="38" height="38" fill="url(#hatch)"/>
  <rect x="64" y="230" width="38" height="38" fill="url(#hatch)"/>
