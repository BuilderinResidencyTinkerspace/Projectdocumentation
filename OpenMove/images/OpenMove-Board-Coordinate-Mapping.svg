  <rect x="330" y="192" width="38" height="38" fill="url(#hatch)"/>
  <rect x="330" y="116" width="38" height="38" fill="url(#hatch)"/>
  <rect x="330" y="40" width="38" height="38" fill="url(#hatch)"/>
  <rect x="64" y="40" width="304" height="304" fill="none" stroke="#000000" stroke-width="3"/>
  <text class="co" x="83.0" y="358">a</text>
  <text class="co" x="121.0" y="358">b</text>
  <text class="co" x="159.0" y="358">c</text>
  <text class="co" x="197.0" y="358">d</text>
  <text class="co" x="235.0" y="358">e</text>
  <text class="co" x="273.0" y="358">f</text>
  <text class="co" x="311.0" y="358">g</text>
  <text class="co" x="349.0" y="358">h</text>
