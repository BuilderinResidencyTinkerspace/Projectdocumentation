  <text class="co" x="52" y="97.0">7</text>
  <text class="co" x="52" y="59.0">8</text>
  <circle cx="83.0" cy="325.0" r="5" fill="#000000"/>
  <rect x="86.0" y="294.0" width="62" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text class="pt" x="117.0" y="303.0">a1 (0, 0)</text>
  <circle cx="121.0" cy="325.0" r="5" fill="#000000"/>
  <rect x="135.0" y="314.0" width="52" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text class="pt" x="161.0" y="323.0">(44, 0)</text>
  <circle cx="83.0" cy="287.0" r="5" fill="#000000"/>
  <rect x="93.0" y="260.0" width="52" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text class="pt" x="119.0" y="269.0">(0, 44)</text>
  <circle cx="349.0" cy="59.0" r="5" fill="#000000"/>
  <rect x="258.0" y="72.0" width="86" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text class="pt" x="301.0" y="81.0">h8 (308, 308)</text>
  <path class="w" d="M64,378 L368,378" marker-end="url(#head)"/>
  <text class="tb" x="278" y="398">+X: a to h</text>
  <path class="w" d="M30,344 L30,40" marker-end="url(#head)"/>
  <text class="tb" x="24" y="30" text-anchor="start">+Y: 1 to 8</text>
  <text class="hd" x="420" y="60">HOW THE ORIGIN WAS FOUND</text>
  <text class="tb" x="420" y="90">Guess 1: home labelled h1</text>
  <text class="tx" x="420" y="108">GOTO g1 reached g8, GOTO h2 reached h7.</text>
  <text class="tx" x="420" y="126">Files right, ranks mirrored.</text>
  <text class="tb" x="420" y="160">Guess 2: home labelled h8</text>
  <text class="tx" x="420" y="178">GOTO e2 reached d7, GOTO h8 reached a1.</text>
  <text class="tx" x="420" y="196">The mapping was rotated 180 degrees.</text>
  <text class="tb" x="420" y="230">Answer: home is a1</text>
  <text class="tx" x="420" y="248">a1 = (0, 0), +X towards b1, +Y towards a2.</text>
  <text class="tx" x="420" y="266">Firmware 2.5 reversed logical X only.</text>
  <text class="tb" x="420" y="300">Square pitch: 44 mm</text>
  <text class="tx" x="420" y="318">Measured between neighbouring centres.</text>
  <text class="tx" x="420" y="336">At 40 steps/mm: 1,760 steps per motor.</text>
</svg>