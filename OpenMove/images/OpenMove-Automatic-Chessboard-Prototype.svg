      .sub  { font-family: Arial, "Liberation Sans", sans-serif; font-size: 15px; fill: #000000; }
      .tag  { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 12px; fill: #000000; letter-spacing: 1.2px; }
      .co   { font-family: Arial, "Liberation Sans", sans-serif; font-weight: 700; font-size: 11px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .pc   { font-family: "DejaVu Sans", "Noto Sans Symbols2", "Segoe UI Symbol", sans-serif; font-size: 28px; text-anchor: middle; dominant-baseline: central; fill: #000000; }
    </style>
