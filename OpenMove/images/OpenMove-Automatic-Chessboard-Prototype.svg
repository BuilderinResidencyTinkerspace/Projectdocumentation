      .t    { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; }
      .dash { fill: none; stroke: #000000; stroke-width: 2.4; stroke-dasharray: 7 5; }
      .f    { fill: #000000; }
      .h1   { font-family: "Arial Black", Arial, "Liberation Sans", sans-serif; font-weight: 900; font-size: 58px; fill: #000000; letter-spacing: 2px; }
