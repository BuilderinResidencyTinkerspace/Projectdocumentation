<svg xmlns="http://www.w3.org/2000/svg" width="750" height="530" viewBox="0 0 750 530">
  <!--
    Block diagram: OpenMove automatic chessboard prototype (digestdocs, CircuitDigest style)
    Host computer -> USB serial -> Arduino Uno + CNC Shield V3 -> 2 x DRV8825 -> 2 x NEMA 17 -> H-bot carriage,
    and D11 -> MG90S magnet lift riding on the carriage. 12V adapter feeds the drivers, a regulated 5V supply feeds the servo.
    Dashed: the Stockfish API (deployed on an Azure VM but not linked to the board) and the planned Hall-sensor grid.
  -->
  <defs>
    <style>
      .bg   { fill: #ffffff; }
      .box  { fill: #ffffff; stroke: #000000; stroke-width: 3; }
      .dbox { fill: #ffffff; stroke: #000000; stroke-width: 3; stroke-dasharray: 10 7; }
      .wire { fill: none; stroke: #000000; stroke-width: 4; stroke-linejoin: miter; }
      .dash { fill: none; stroke: #000000; stroke-width: 4; stroke-dasharray: 11 8; }
      .lbl  { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: "Times New Roman", Times, "Liberation Serif", serif; font-weight: 700;
              font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="750" height="530"/>
  <g id="watermark" opacity="0.10"></g>

  <!-- Row 1 -->
  <rect class="dbox" x="20" y="20" width="200" height="64"/>
  <text class="lbl" x="120" y="42">Chess Engine</text>
  <text class="lbl" x="120" y="63">(Stockfish API, Azure VM)</text>

  <rect class="box" x="262" y="20" width="226" height="64"/>
  <text class="lbl" x="375" y="42">Host Computer</text>
  <text class="lbl" x="375" y="63">(GUI, TUI, python-chess)</text>

  <rect class="dbox" x="530" y="20" width="200" height="64"/>
  <text class="lbl" x="630" y="42">Piece Sensing</text>
  <text class="lbl" x="630" y="63">(8 x 8 Hall Grid, Planned)</text>

  <!-- Row 2 -->
  <rect class="box" x="20" y="150" width="200" height="64"/>
  <text class="lbl" x="120" y="172">Motor Supply</text>
  <text class="lbl" x="120" y="193">(12V 3A Adapter)</text>

  <rect class="box" x="262" y="150" width="226" height="64"/>
  <text class="lbl" x="375" y="172">Motion Controller</text>
  <text class="lbl" x="375" y="193">(Uno + CNC Shield V3)</text>

  <rect class="box" x="530" y="150" width="200" height="64"/>
  <text class="lbl" x="630" y="172">Servo Supply</text>
  <text class="lbl" x="630" y="193">(Regulated 5V)</text>

  <!-- Row 3 -->
  <rect class="box" x="20" y="280" width="200" height="64"/>
  <text class="lbl" x="120" y="302">Stepper Drivers</text>
  <text class="lbl" x="120" y="323">(2 x DRV8825)</text>

  <rect class="box" x="530" y="280" width="200" height="64"/>
  <text class="lbl" x="630" y="302">Magnet Lift</text>
  <text class="lbl" x="630" y="323">(MG90S + Printed Rack)</text>

  <!-- Row 4 -->
  <rect class="box" x="20" y="410" width="200" height="64"/>
  <text class="lbl" x="120" y="432">Stepper Motors</text>
  <text class="lbl" x="120" y="453">(2 x NEMA 17)</text>

  <rect class="box" x="262" y="410" width="226" height="64"/>
  <text class="lbl" x="375" y="432">XY Carriage</text>
  <text class="lbl" x="375" y="453">(H-bot, GT2 Belts, 4 mm Rods)</text>

  <!-- Connectors -->
  <path class="dash" d="M224,52 L258,52" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="note" x="241" y="104">FEN / UCI</text>
  <text class="note" x="241" y="120">(not linked)</text>

  <path class="dash" d="M530,52 L492,52" marker-end="url(#head)"/>

  <path class="wire" d="M375,84 L375,146" marker-end="url(#head)"/>
  <text class="note" x="440" y="108">USB serial</text>
  <text class="note" x="440" y="124">115200 baud</text>

  <path class="wire" d="M120,214 L120,276" marker-end="url(#head)"/>
  <text class="note" x="144" y="245">12V</text>

  <path class="wire" d="M630,214 L630,276" marker-end="url(#head)"/>
  <text class="note" x="652" y="245">5V</text>

  <path class="wire" d="M330,214 L330,312 L224,312" marker-end="url(#head)"/>
  <text class="note" x="276" y="296">STEP / DIR</text>

  <path class="wire" d="M420,214 L420,312 L526,312" marker-end="url(#head)"/>
  <text class="note" x="474" y="296">D11 PWM</text>

  <path class="wire" d="M120,344 L120,406" marker-end="url(#head)"/>

  <path class="wire" d="M220,442 L258,442" marker-end="url(#head)"/>
  <text class="note" x="240" y="428">belts</text>

  <path class="wire" d="M630,344 L630,442 L492,442" marker-end="url(#head)"/>
  <text class="note" x="560" y="428">rides on</text>

  <!-- Legend -->
  <rect x="560" y="482" width="26" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text class="note" x="660" y="491">Planned, not linked</text>
</svg>
