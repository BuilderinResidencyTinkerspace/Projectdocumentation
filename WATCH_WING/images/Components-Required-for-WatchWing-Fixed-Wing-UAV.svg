<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <!-- Components grid: WatchWing fixed-wing UAV. Black line drawings on white, 5 x 2 grid, bold label under each. -->
  <defs>
    <style>
      .bg  { fill: #ffffff; }
      .o   { fill: #ffffff; stroke: #000000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .t   { fill: none; stroke: #000000; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .f   { fill: #000000; }
      .lbl { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 13.5px;
             fill: #000000; text-anchor: middle; letter-spacing: 0.4px; }
      .in  { font-family: Arial, "Liberation Sans", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11px;
             fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="750" height="500"/>

  <!-- 1. Pixhawk 2.4.8 (centre x 75) -->
  <rect class="o" x="18" y="70" width="106" height="70" rx="12"/>
  <rect class="o" x="122" y="80" width="14" height="50" rx="2"/>
  <path class="t" d="M126,88 L132,88 M126,96 L132,96 M126,104 L132,104 M126,112 L132,112 M126,120 L132,120"/>
  <text x="70" y="104" font-family="Arial, 'Liberation Sans', sans-serif" font-weight="700" font-style="italic" font-size="17" text-anchor="middle" fill="#000000">pixhawk</text>
  <text class="in" x="70" y="122">2.4.8</text>
  <circle class="t" cx="34" cy="84" r="4"/>
  <text class="lbl" x="75" y="205">PIXHAWK 2.4.8</text>

  <!-- 2. M10 GPS module (centre x 225) -->
  <circle class="o" cx="225" cy="105" r="46"/>
  <circle class="t" cx="225" cy="105" r="36"/>
  <path class="f" d="M225,74 L232,86 L218,86 Z"/>
  <text class="in" x="225" y="104" font-size="14">GPS</text>
  <text class="in" x="225" y="122">M10</text>
  <text class="lbl" x="225" y="205">M10 GPS MODULE</text>

  <!-- 3. FlySky FS-i6 transmitter (centre x 375) -->
  <rect class="o" x="371" y="40" width="8" height="28" rx="3"/>
  <path class="t" d="M327,66 L322,52 M339,66 L339,54 M411,66 L411,54 M423,66 L428,52"/>
  <circle class="f" cx="322" cy="52" r="2.5"/><circle class="f" cx="339" cy="54" r="2.5"/>
  <circle class="f" cx="411" cy="54" r="2.5"/><circle class="f" cx="428" cy="52" r="2.5"/>
  <path class="o" d="M330,66 L420,66 Q436,66 436,82 L436,140 Q436,160 420,160 L330,160 Q314,160 314,140 L314,82 Q314,66 330,66 Z"/>
  <rect class="o" x="326" y="78" width="36" height="36" rx="5"/>
  <circle class="t" cx="344" cy="96" r="11"/>
  <path class="t" d="M344,96 L350,86" stroke-width="3"/>
  <circle class="f" cx="350" cy="86" r="3.5"/>
  <rect class="o" x="388" y="78" width="36" height="36" rx="5"/>
  <circle class="t" cx="406" cy="96" r="11"/>
  <path class="t" d="M406,96 L400,86" stroke-width="3"/>
  <circle class="f" cx="400" cy="86" r="3.5"/>
  <path class="t" d="M330,121 L358,121 M392,121 L420,121 M320,82 L320,110 M430,82 L430,110"/>
  <rect class="o" x="356" y="118" width="38" height="22" rx="2"/>
  <path class="t" d="M361,125 L389,125 M361,132 L380,132"/>
  <circle class="t" cx="363" cy="150" r="3"/><circle class="t" cx="375" cy="150" r="3"/><circle class="t" cx="387" cy="150" r="3"/>
  <text class="lbl" x="375" y="205">FLYSKY FS-i6</text>

  <!-- 4. FS-iA10B receiver (centre x 525) -->
  <path class="t" d="M494,82 C492,68 484,60 472,52"/>
  <path class="t" d="M472,52 L462,44" stroke-width="3.2"/>
  <path class="t" d="M508,82 C511,66 521,58 534,50"/>
  <path class="t" d="M534,50 L545,43" stroke-width="3.2"/>
  <rect class="o" x="478" y="82" width="86" height="54" rx="4"/>
  <text class="in" x="519" y="104" font-size="11">FS-iA10B</text>
  <circle class="t" cx="492" cy="124" r="3.5"/>
  <rect class="o" x="564" y="84" width="16" height="50" rx="2"/>
  <path class="t" d="M568,90 L576,90 M568,97 L576,97 M568,104 L576,104 M568,111 L576,111 M568,118 L576,118 M568,125 L576,125"/>
  <text class="lbl" x="525" y="205">FS-iA10B</text>
  <text class="lbl" x="525" y="222">RECEIVER</text>

  <!-- 5. A2212 1400KV outrunner motor (centre x 675) -->
  <path class="o" d="M675,52 L675,72"/>
  <rect class="o" x="647" y="72" width="56" height="50" rx="5"/>
  <path class="t" d="M647,82 L703,82 M647,112 L703,112"/>
  <text class="in" x="675" y="97" font-size="10">A2212</text>
  <rect class="o" x="655" y="122" width="40" height="12" rx="2"/>
  <rect class="o" x="638" y="134" width="74" height="7" rx="2"/>
  <path class="t" d="M695,128 C710,128 716,134 726,140 M695,131 C708,132 712,140 720,146 M695,125 C712,124 720,128 732,132"/>
  <text class="lbl" x="675" y="205">A2212 1400KV</text>
  <text class="lbl" x="675" y="222">MOTOR</text>

  <!-- 6. SimonK 30A ESC (centre x 75) -->
  <path class="t" d="M12,345 L30,345" stroke-width="3"/>
  <path class="t" d="M12,355 L30,355" stroke-width="3"/>
  <path class="t" d="M14,366 C20,366 24,364 30,364"/>
  <rect class="o" x="30" y="333" width="82" height="42" rx="10"/>
  <text class="in" x="71" y="349" font-size="10">SimonK</text>
  <text class="in" x="71" y="363">30A</text>
  <path class="t" d="M112,343 L138,343 M112,354 L138,354 M112,365 L138,365"/>
  <circle class="f" cx="139" cy="343" r="2.5"/><circle class="f" cx="139" cy="354" r="2.5"/><circle class="f" cx="139" cy="365" r="2.5"/>
  <text class="lbl" x="75" y="455">SIMONK 30A ESC</text>

  <!-- 7. 3S 3300mAh LiPo (centre x 225) -->
  <path class="t" d="M188,330 L188,318"/>
  <rect class="o" x="180" y="309" width="16" height="9" rx="1"/>
  <rect class="o" x="160" y="330" width="104" height="50" rx="6"/>
  <text class="in" x="212" y="348" font-size="15">3S LiPo</text>
  <text class="in" x="212" y="366" font-size="10">3300mAh</text>
  <path class="t" d="M264,346 L276,346 M264,364 L276,364" stroke-width="3"/>
  <rect class="o" x="276" y="340" width="14" height="30" rx="2"/>
  <text class="lbl" x="225" y="455">3S 3300mAh LIPO</text>

  <!-- 8. SG90 micro servo (centre x 375) -->
  <rect class="o" x="336" y="314" width="58" height="8" rx="4"/>
  <circle class="f" cx="342" cy="318" r="1.6"/><circle class="f" cx="352" cy="318" r="1.6"/>
  <circle class="f" cx="378" cy="318" r="1.6"/><circle class="f" cx="388" cy="318" r="1.6"/>
  <rect class="o" x="358" y="322" width="10" height="8" rx="1"/>
  <rect class="o" x="345" y="330" width="62" height="48" rx="3"/>
  <rect class="o" x="331" y="340" width="90" height="7" rx="1"/>
  <circle class="t" cx="338" cy="343.5" r="2"/><circle class="t" cx="414" cy="343.5" r="2"/>
  <text class="in" x="376" y="362" font-size="11">SG90</text>
  <path class="t" d="M407,372 C420,372 424,382 436,390"/>
  <path class="t" d="M407,375 C418,376 420,386 432,394"/>
  <text class="lbl" x="375" y="455">SG90 SERVO ×4</text>

  <!-- 9. Propeller (centre x 525) -->
  <path class="o" d="M533,351 C560,337 596,336 608,346 C597,358 561,365 533,359 Z"/>
  <path class="o" d="M517,359 C490,373 454,374 442,364 C453,352 489,345 517,351 Z"/>
  <circle class="o" cx="525" cy="355" r="10"/>
  <circle class="f" cx="525" cy="355" r="3"/>
  <text class="lbl" x="525" y="455">PROPELLER</text>

  <!-- 10. 5 mm Depron sheet (centre x 675) -->
  <path class="o" d="M612,342 L700,316 L740,346 L652,372 Z"/>
  <path class="o" d="M612,342 L612,349 L652,379 L652,372 Z"/>
  <path class="o" d="M652,372 L652,379 L740,353 L740,346 Z"/>
  <path class="t" d="M640,342 L692,327 L712,342 L660,357 Z" stroke-dasharray="4 3"/>
  <path class="t" d="M651,351 L702,336" stroke-dasharray="4 3"/>
  <text class="lbl" x="675" y="455">5 mm DEPRON</text>
  <text class="lbl" x="675" y="472">SHEET</text>
</svg>
